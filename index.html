<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шмурдяк · визитка</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080606;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 30px 20px;
            color: #ddd;
            background-image: radial-gradient(ellipse at 20% 40%, #1a0e0c, #080606 90%);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .fade-item {
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }

        .wrap {
            max-width: 700px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #1e1210;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #eee;
        }

        .logo span {
            color: #ff3b00;
            text-shadow: 0 0 40px rgba(255, 59, 0, 0.6), 0 0 80px rgba(255, 59, 0, 0.2);
        }

        .nav {
            display: flex;
            gap: 24px;
        }

        .nav a {
            color: #7a6a6a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .nav a:hover {
            color: #ff3b00;
            border-bottom-color: #ff3b00;
            text-shadow: 0 0 20px rgba(255, 59, 0, 0.2);
        }

        .content {
            margin-top: 40px;
        }

        .content h1 {
            font-size: 42px;
            font-weight: 800;
            color: #f0e0e0;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .content h1 span {
            color: #ff3b00;
            text-shadow: 0 0 40px rgba(255, 59, 0, 0.4);
        }

        .content .sub {
            font-size: 18px;
            color: #b0a0a0;
            font-weight: 300;
            margin-bottom: 30px;
            border-bottom: 1px solid #1a0e0c;
            padding-bottom: 18px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(14, 10, 10, 0.6);
            padding: 16px 20px;
            text-decoration: none;
            color: #ddd;
            font-weight: 500;
            font-size: 16px;
            border: 1px solid #1e1210;
            border-radius: 12px;
            backdrop-filter: blur(2px);
            transition: 0.25s;
        }

        .btn:hover {
            border-color: #ff3b00;
            background: rgba(14, 10, 10, 0.8);
            box-shadow: 0 0 30px rgba(255, 59, 0, 0.06);
            transform: translateX(4px);
        }

        .btn .icon {
            font-size: 22px;
            width: 32px;
            text-align: center;
        }

        .btn .badge {
            margin-left: auto;
            background: #ff3b00;
            color: #080606;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(255, 59, 0, 0.2);
        }

        .btn .badge-gray {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.04);
            color: #6a5a5a;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }

        .cta-btn {
            display: block;
            text-align: center;
            background: #ff3b00;
            color: #080606;
            font-weight: 700;
            font-size: 17px;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: 0.25s;
            margin-top: 18px;
            box-shadow: 0 0 30px rgba(255, 59, 0, 0.15);
        }

        .cta-btn:hover {
            background: #ff5a2a;
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(255, 59, 0, 0.25);
        }

        .cta-btn.secondary {
            background: rgba(14, 10, 10, 0.6);
            color: #ddd;
            border: 1px solid #1e1210;
            box-shadow: none;
            backdrop-filter: blur(2px);
        }

        .cta-btn.secondary:hover {
            border-color: #ff3b00;
            background: rgba(255, 59, 0, 0.04);
            box-shadow: 0 0 30px rgba(255, 59, 0, 0.06);
        }

        .cta-note {
            text-align: center;
            font-size: 13px;
            color: #4a3a3a;
            margin: 12px 0 20px;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 40px;
            border-top: 1px solid #1a0e0c;
            padding-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #3a2a2a;
            letter-spacing: 1px;
        }

        .footer a {
            color: #6a5a5a;
            text-decoration: none;
            transition: 0.2s;
        }

        .footer a:hover {
            color: #ff3b00;
            text-shadow: 0 0 20px rgba(255, 59, 0, 0.2);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .content h1 {
                font-size: 30px;
            }
            .btn {
                font-size: 15px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

<div class="wrap">
    <div class="header fade-item" style="animation-delay: 0.15s;">
        <div class="logo">Шмурдяк <span>·</span> визитка</div>
        <div class="nav">
            <a href="https://alexunikum.github.io/shmurdyak-services/" target="_blank" rel="noopener noreferrer">Услуги</a>
            <a href="https://alexunikum.github.io/faq/" target="_blank" rel="noopener noreferrer">FAQ</a>
        </div>
    </div>

    <div class="content">
        <h1 class="fade-item" style="animation-delay: 0.2s;">вайбкодер <span>Шмурдяк</span></h1>
        <div class="sub fade-item" style="animation-delay: 0.25s;">сайты, каталоги, генераторы — от 5 500 ₽</div>

        <div class="btn-group">
            <a href="#" class="btn fade-item" id="discordBtn" style="animation-delay: 0.3s;">
                <span class="icon">💬</span>
                <span>Discord</span>
                <span class="badge">копировать</span>
            </a>
            <a href="https://vk.com/peacedose1" target="_blank" rel="noopener noreferrer" class="btn fade-item" style="animation-delay: 0.35s;">
                <span class="icon">📱</span>
                <span>ВКонтакте</span>
                <span class="badge-gray">перейти</span>
            </a>
            <a href="https://steamcommunity.com/id/alexunikum/" target="_blank" rel="noopener noreferrer" class="btn fade-item" style="animation-delay: 0.4s;">
                <span class="icon">🎮</span>
                <span>Steam</span>
                <span class="badge-gray">перейти</span>
            </a>
        </div>

        <a href="https://t.me/Shprotina27" target="_blank" rel="noopener noreferrer" class="cta-btn fade-item" style="animation-delay: 0.45s;">
            📩 Связаться по заказу в Telegram
        </a>
        <a href="https://t.me/Shprotina109" target="_blank" rel="noopener noreferrer" class="cta-btn secondary fade-item" style="animation-delay: 0.5s;">
            ✉️ Личный Telegram
        </a>
        <div class="cta-note fade-item" style="animation-delay: 0.55s;">отвечаю в течение часа</div>
    </div>

    <div class="footer fade-item" style="animation-delay: 0.6s;">
        <p>сделано <a href="https://alexunikum.github.io/shmurdyak-main-site/" target="_blank" rel="noopener noreferrer">Шмурдяком</a> — все работы индивидуальны</p>
    </div>
</div>

<div id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#1a0e0c; color:#ddd; padding:12px 28px; border:1px solid #ff3b00; border-radius:12px; font-size:15px; opacity:0; transition:0.4s; pointer-events:none; z-index:999;">
    ✅ Скопировано
</div>

<script>
    const contacts = {
        discord: "ishak8_",
        telegram: "@Shprotina109"
    };

    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = '✅ ' + text;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(100px)';
        }, 1500);
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('Скопировано: ' + text);
        }).catch(() => {
            showToast('❌ Не удалось скопировать');
        });
    }

    document.getElementById('discordBtn').addEventListener('click', function(e) {
        e.preventDefault();
        copyText(contacts.discord);
    });

    document.getElementById('telegramBtn').addEventListener('click', function(e) {
        e.preventDefault();
        copyText(contacts.telegram);
    });
</script>

</body>
</html>
